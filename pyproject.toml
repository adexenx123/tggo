[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tggo"
version = "1.0.0"
description = "A narrow Codex-to-Telegram text and attachment gateway"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.scripts]
tggo = "tggo.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
